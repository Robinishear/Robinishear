<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="t d">
<title id="t">Robin Ryan, Web App Full Stack Developer</title>
<desc id="d">Profile banner: Robin Ryan, web app full stack developer. LLM, RAG, AI chatbot, Python, Golang, JavaScript, VS Code extensions, algorithms, data structures.</desc>
<defs>
<style>
  .sans{font-family:Inter,"Segoe UI","Helvetica Neue",Arial,sans-serif}
  .serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
  .mono{font-family:"JetBrains Mono","Courier New",monospace}
  .in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.in{animation:none}}
</style>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#1B0711"/><stop offset=".55" stop-color="#2A0C1C"/><stop offset="1" stop-color="#4A1230"/>
</linearGradient>
<radialGradient id="glowR" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#C2185B" stop-opacity=".38"/><stop offset="1" stop-color="#C2185B" stop-opacity="0"/></radialGradient>
<radialGradient id="glowL" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8E2457" stop-opacity=".25"/><stop offset="1" stop-color="#8E2457" stop-opacity="0"/></radialGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4B6D2" stop-opacity="0"/><stop offset=".5" stop-color="#F4B6D2"/><stop offset="1" stop-color="#F4B6D2" stop-opacity="0"/></linearGradient>
<linearGradient id="archBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C9DB"/><stop offset="1" stop-color="#B5547F"/></linearGradient>
<pattern id="stripes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="1" height="6" fill="#FFFFFF" fill-opacity=".025"/></pattern>

<!-- arch shape for photo -->
<clipPath id="arch"><path d="M1090 620V280A170 170 0 0 1 1430 280V620Z"/></clipPath>
<clipPath id="frame"><rect width="1600" height="740" rx="28"/></clipPath>

<!-- skill logos -->
<symbol id="l-js" viewBox="0 0 30 30"><rect width="30" height="30" rx="5" fill="#F7DF1E"/><text x="27" y="26" font-family="Arial,sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#1b1b1b">JS</text></symbol>
<symbol id="l-go" viewBox="0 0 30 30"><rect width="30" height="30" rx="7" fill="#00ADD8"/><text x="15" y="21" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#fff">GO</text></symbol>
<symbol id="l-py" viewBox="0 0 30 30"><rect x="2" y="2" width="17" height="17" rx="6" fill="#3776AB"/><rect x="11" y="11" width="17" height="17" rx="6" fill="#FFD43B"/><circle cx="8.5" cy="7.5" r="1.6" fill="#fff"/><circle cx="21.5" cy="22.5" r="1.6" fill="#3776AB"/></symbol>
<symbol id="l-vs" viewBox="0 0 30 30"><polygon points="21,2 28,5.5 28,24.5 21,28 10,17.5 5,21.5 2,20 2,10 5,8.5 10,12.5" fill="#007ACC"/><polygon points="21,9 21,21 14,15" fill="#0A0F1E" opacity=".35"/></symbol>
<symbol id="l-ai" viewBox="0 0 30 30"><path d="M4 4h22a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H14l-6 5v-5H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#E8A0C0"/><path d="M15 7l1.7 4.3L21 13l-4.3 1.7L15 19l-1.7-4.3L9 13l4.3-1.7z" fill="#fff"/></symbol>
<symbol id="l-llm" viewBox="0 0 30 30"><rect width="30" height="30" rx="8" fill="#F4B6D2"/><path d="M15 5l2.4 6.6L24 14l-6.6 2.4L15 23l-2.4-6.6L6 14l6.6-2.4z" fill="#2A0C1C"/></symbol>
<symbol id="l-rag" viewBox="0 0 30 30"><rect x="3" y="2" width="18" height="24" rx="3" fill="none" stroke="#FFB84D" stroke-width="2.2"/><path d="M8 9h8M8 14h6" stroke="#FFB84D" stroke-width="2.2" stroke-linecap="round"/><circle cx="20" cy="20" r="5" fill="#2A0C1C" stroke="#FFB84D" stroke-width="2.4"/><path d="M24 24l4 4" stroke="#FFB84D" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="l-algo" viewBox="0 0 30 30"><g stroke="#FFB84D" stroke-width="2" fill="none"><path d="M8 8h14M8 8v14M22 8v14M8 22h14"/></g><circle cx="8" cy="8" r="4" fill="#FFB84D"/><circle cx="22" cy="8" r="4" fill="#FFB84D"/><circle cx="8" cy="22" r="4" fill="#FFB84D"/><circle cx="22" cy="22" r="4" fill="#FFB84D"/></symbol>
<symbol id="l-ds" viewBox="0 0 30 30"><g stroke="#F4B6D2" stroke-width="2" fill="none"><path d="M15 7L7 21M15 7l8 14"/></g><circle cx="15" cy="6" r="4.2" fill="#F4B6D2"/><circle cx="7" cy="22" r="4.2" fill="#F4B6D2"/><circle cx="23" cy="22" r="4.2" fill="#F4B6D2"/></symbol>
</defs>

<!-- background (no border) -->
<g clip-path="url(#frame)">
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#stripes)"/>
  <ellipse cx="1260" cy="360" rx="520" ry="440" fill="url(#glowR)"/>
  <ellipse cx="220" cy="120" rx="560" ry="300" fill="url(#glowL)"/>

  <!-- tiny sparkles -->
  <g fill="#F4B6D2">
    <circle cx="930" cy="90" r="2.2" opacity=".8"/><circle cx="1540" cy="180" r="2" opacity=".6"/>
    <circle cx="1000" cy="660" r="1.8" opacity=".5"/><circle cx="1500" cy="640" r="2.2" opacity=".7"/>
    <circle cx="860" cy="330" r="1.6" opacity=".4"/>
  </g>

  <!-- terminal pill -->
  <g class="in" style="animation-delay:.05s">
    <rect x="120" y="70" width="270" height="40" rx="20" fill="#14040C" fill-opacity=".7"/>
    <circle cx="142" cy="90" r="4" fill="#C2185B"/>
    <text class="mono" x="158" y="95" font-size="14" fill="#B88AA0">~/robin <tspan fill="#F4B6D2">$</tspan><tspan fill="#F6E3EC"> build --intelligent</tspan></text>
    <rect x="368" y="82" width="7" height="16" fill="#F4B6D2"/>
  </g>

  <!-- eyebrow -->
  <g class="in" style="animation-delay:.15s">
    <rect x="120" y="152" width="34" height="2" fill="#C2185B"/>
    <text class="mono" x="168" y="158" font-size="15" letter-spacing="4" fill="#B5647F">AI · ENGINEERING · FULL STACK</text>
  </g>

  <!-- name -->
  <g class="in" style="animation-delay:.25s">
    <text class="serif" x="116" y="285" font-size="118" fill="#FBEFF4" letter-spacing="-2">Robin</text>
    <text class="serif" x="116" y="395" font-size="118" font-style="italic" fill="#F2BFD6" letter-spacing="-2">Ryan<tspan fill="#E8A0C0">.</tspan></text>
    <rect x="120" y="418" width="460" height="2" fill="url(#line)"/>
  </g>

  <!-- subtitle -->
  <g class="in" style="animation-delay:.4s">
    <text class="mono" x="122" y="458" font-size="19" letter-spacing="4" fill="#F6E3EC">WEB APP · FULL STACK DEVELOPER</text>
  </g>

  <!-- skill chips (no borders) -->
  <g class="sans" font-size="22" font-weight="600" fill="#FBEFF4">
    <!-- row 1 -->
    <g class="in" style="animation-delay:.5s"><rect x="120" y="496" width="118" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-llm" x="134" y="506" width="34" height="34"/><text x="180" y="531">LLM</text></g>
    <g class="in" style="animation-delay:.58s"><rect x="250" y="496" width="118" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-rag" x="264" y="506" width="34" height="34"/><text x="310" y="531">RAG</text></g>
    <g class="in" style="animation-delay:.66s"><rect x="380" y="496" width="202" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-ai" x="394" y="506" width="34" height="34"/><text x="440" y="531">AI Chatbot</text></g>
    <g class="in" style="animation-delay:.74s"><rect x="594" y="496" width="154" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-py" x="608" y="506" width="34" height="34"/><text x="654" y="531">Python</text></g>
    <!-- row 2 -->
    <g class="in" style="animation-delay:.82s"><rect x="120" y="562" width="154" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-go" x="134" y="572" width="34" height="34"/><text x="180" y="597">Golang</text></g>
    <g class="in" style="animation-delay:.9s"><rect x="286" y="562" width="202" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-js" x="300" y="572" width="34" height="34"/><text x="346" y="597">JavaScript</text></g>
    <g class="in" style="animation-delay:.98s"><rect x="500" y="562" width="286" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-vs" x="514" y="572" width="34" height="34"/><text x="560" y="597">VS Code Extension</text></g>
    <!-- row 3 -->
    <g class="in" style="animation-delay:1.06s"><rect x="120" y="628" width="202" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-algo" x="134" y="638" width="34" height="34"/><text x="180" y="663">Algorithms</text></g>
    <g class="in" style="animation-delay:1.14s"><rect x="334" y="628" width="262" height="54" rx="27" fill="#3A1226" fill-opacity=".85"/><use xlink:href="#l-ds" x="348" y="638" width="34" height="34"/><text x="394" y="663">Data Structures</text></g>
  </g>

  <!-- arch photo (no border, no ring, no animation) -->
  <g>
    <path d="M1090 620V280A170 170 0 0 1 1430 280V620Z" fill="url(#archBg)"/>
    <!-- PASTE your base64 photo in href below. Keep it under 200 KB -->
    <image x="1090" y="110" width="340" height="510" clip-path="url(#arch)"
           preserveAspectRatio="xMidYMid slice"
           href="data:image/jpeg;base64,PASTE_YOUR_BASE64_HERE"/>
  </g>
</g>
</svg>
