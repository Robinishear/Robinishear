<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="1632" viewBox="0 0 1600 680" role="img" aria-labelledby="t d">
<title id="t">Robin Ryan, Web App Full Stack Developer</title>
<desc id="d">Animated profile banner: Robin Ryan, web app full stack developer. LLM, RAG, AI chatbot, Python, Golang, JavaScript, VS Code extensions, algorithms, data structures.</desc>
<defs>
<style>
