  <animate attributeName="x2" values="0;0;960" keyTimes="0;.35;1" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="gBeam" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
